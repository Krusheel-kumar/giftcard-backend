[build]
builder = "nixpacks"

[build.nixpacks]
# Tell Nixpacks to install Java 17 during the build phase
providers = ["jdk17"]

[deploy]
# Apply memory limits only at run time (NOT build time, to avoid crashes)
startCommand = "java -Xmx256m -Xms128m -XX:TieredStopAtLevel=1 -Xss512k -jar build/libs/*.jar"
