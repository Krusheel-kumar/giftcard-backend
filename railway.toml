[build]
builder = "nixpacks"

[deploy]
# We let Railway do its default start command, we just inject the environment variables below

[env]
# Limit maximum RAM usage to 256MB (saves massive amounts of money)
# TieredStopAtLevel=1 speeds up startup time significantly
JAVA_TOOL_OPTIONS = "-Xmx256m -Xms128m -XX:TieredStopAtLevel=1 -Xss512k"
