spring.application.name=giftcard-backend
server.port=${PORT:8081}

# PostgreSQL — all values MUST be set as Railway environment variables. No fallbacks.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security Configuration — MUST be set as Railway environment variables. No fallbacks.
admin.password=${ADMIN_PASSWORD}
jwt.secret=${JWT_SECRET}
msg91.auth-key=${MSG91_AUTH_KEY}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,https://giftcard.popobob.com,https://staff-admin.popobob.com}

server.forward-headers-strategy=framework

# Actuator (for Railway health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
