spring.application.name=giftcard-backend
server.port=8081

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security Configuration
admin.password=${ADMIN_PASSWORD:changeme-set-a-strong-password-in-env}
jwt.secret=${JWT_SECRET:your_super_secret_key_that_needs_to_be_long_enough_for_hs512_alg}
msg91.auth-key=${MSG91_AUTH_KEY}

server.forward-headers-strategy=framework
